<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-v2-32.png" />
    <link rel="apple-touch-icon" href="/icon-v2-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Talkies" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <title>Talkies</title>
    <!-- Wake the server the instant the page starts (in parallel with downloading the app), so a sleeping host is already warm when the app asks for data. -->
    <script>try{fetch("/api/health",{cache:"no-store",credentials:"omit",keepalive:true}).catch(function(){})}catch(e){}</script>
    <!-- Right colours from the very first paint (white by default), so nothing flashes before the app loads. -->
    <script>
      try {
        var t = localStorage.getItem("chat-theme") || "light";
        var d = ["dark","night","dracula","forest","business","luxury","black","synthwave"].indexOf(t) > -1;
        if (d) document.documentElement.classList.add("wa-dark");
        document.documentElement.setAttribute("data-theme", t);
        var cc = localStorage.getItem("talkies-chat-color");
        if (cc) document.documentElement.setAttribute("data-chat-color", cc);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", d ? "#111B21" : "#FFFFFF");
      } catch (e) {}
    </script>
    <!-- Safety net: if the app never starts (stale cached files after an update, a failed script, a crash before anything draws), clear the saved copy and reload once; if it still can't start, say so with a Reload button instead of leaving a blank page. -->
    <script>
      (function () {
        var KEY = "talkies-recover";
        function showFail(why) {
          var r = document.getElementById("root");
          if (!r || window.__talkiesBooted) return;
          r.innerHTML =
            '<div class="splash" style="text-align:center;padding:24px"><b>Talkies</b>' +
            '<span style="font-size:15px;opacity:.8">Couldn\u2019t start. Check your connection and try again.</span>' +
            '<button id="tk-reload" style="padding:10px 22px;border:0;border-radius:999px;background:#00A884;color:#fff;font-size:15px">Reload</button>' +
            '<span style="font-size:11px;opacity:.5;max-width:300px;word-break:break-word">' + String(why || "").slice(0, 160) + "</span></div>";
          document.getElementById("tk-reload").onclick = function () {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
            location.reload();
          };
        }
        function recover(why) {
          if (window.__talkiesBooted) return;
          var done = false;
          try { done = !!sessionStorage.getItem(KEY); sessionStorage.setItem(KEY, "1"); } catch (e) {}
          if (done) return showFail(why);
          var jobs = [];
          try { jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (x) { return x.unregister(); })); })); } catch (e) {}
          try { jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        }
        window.__talkiesRecover = recover;
        window.addEventListener("error", function (e) {
          if (e.target && e.target.tagName === "SCRIPT") recover("script failed: " + (e.target.src || ""));
        }, true);
        window.addEventListener("unhandledrejection", function () {});
        setTimeout(function () { recover("app did not start in time"); }, 15000);
      })();
    </script>
    <style>
      html, body, #root { margin: 0; min-height: 100%; background: #FFFFFF; }
      html.wa-dark, html.wa-dark body, html.wa-dark #root { background: #0B141A; }
      /* Branded loading screen: shown by the page itself, then by the app while it signs in. */
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #FFFFFF; color: #111B21; font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      html.wa-dark .splash { background: #0B141A; color: #E9EDEF; }
      .splash img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 14px 34px -12px rgba(0,168,132,.55); animation: splash-pop 1.6s ease-in-out infinite; }
      .splash b { font-size: 22px; letter-spacing: .5px; font-weight: 600; }
      .splash i { display: block; width: 120px; height: 3px; border-radius: 3px; background: rgba(120,140,150,.25); overflow: hidden; position: relative; }
      .splash i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 3px; background: #00A884; animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-pop { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes splash-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash"><img src="/icon-v2-192.png" alt="" /><b>Talkies</b><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
