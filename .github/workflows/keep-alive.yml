name: Keep Render service warm

on:
  schedule:
    # Every 10 minutes — comfortably under Render free tier's 15-minute
    # idle spin-down window, so the app never has to cold-start.
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Chat-App
        run: curl -sS -o /dev/null -w "Status: %{http_code}, Time: %{time_total}s\n" https://chat-app-jjcg.onrender.com/
