name: Keep server awake

# Render's free plan puts the server to sleep after ~15 minutes without visitors,
# and the next person then waits up to a minute for it to wake up. A light ping
# every 5 minutes keeps it awake so the app opens fast.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: curl -fsS -m 60 --retry 2 https://chat-app-jjcg.onrender.com/api/health || true
