# Render's free plan puts the server to sleep after ~15 minutes without traffic. A sleeping server
# can't ring anyone, so the first call after a quiet spell is slow or lost. This pings it often
# enough to keep it awake. (The repo is public, so these runs cost nothing.)
name: Keep server awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the Talkies server
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" https://chat-app-jjcg.onrender.com/api/health || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 0
